{{define "layout"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoHarvest Dashboard</title>
    <!-- Tailwind CSS with Dark Mode support -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- HTMX library -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        // Init theme from localStorage or OS preference before render
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen p-8 transition-colors duration-200">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 border-b border-gray-200 dark:border-gray-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-indigo-600 dark:text-indigo-400">GoHarvest</h1>
                <span class="text-sm text-gray-500 dark:text-gray-400">Live Item Monitor</span>
            </div>
            <div class="flex items-center gap-3">
                <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none rounded-lg text-sm p-2 border border-gray-200 dark:border-gray-700 flex items-center gap-2 transition cursor-pointer" title="Toggle dark mode">
                    <!-- Sun Icon (shown in dark mode) -->
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
                    </svg>
                    <!-- Moon Icon (shown in light mode) -->
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                    <span id="theme-toggle-text" class="text-xs font-medium">Dark Mode</span>
                </button>
            </div>
        </header>

        <main>
            {{template "content" .}}
        </main>
    </div>

    <script>
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleText = document.getElementById('theme-toggle-text');
        const themeToggleBtn = document.getElementById('theme-toggle');

        function updateThemeUI() {
            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
                themeToggleText.textContent = 'Light Mode';
            } else {
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
                themeToggleText.textContent = 'Dark Mode';
            }
        }
        updateThemeUI();

        themeToggleBtn.addEventListener('click', function() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
            updateThemeUI();
        });

        function formatLocalTimes() {
            document.querySelectorAll('time.local-time').forEach(el => {
                const utc = el.getAttribute('datetime');
                if (utc) {
                    const date = new Date(utc);
                    if (!isNaN(date)) {
                        el.textContent = date.toLocaleDateString([], { month: 'short', day: '2-digit' }) + ', ' +
                                         date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                    }
                }
            });
        }
        formatLocalTimes();
        document.body.addEventListener('htmx:afterSwap', formatLocalTimes);
    </script>
</body>
</html>
{{end}}
