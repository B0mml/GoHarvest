global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'dashboard'
    static_configs:
      - targets: ['dashboard:8080']

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:2112']

  - job_name: 'scheduler'
    static_configs:
      - targets: ['scheduler:2113']
